<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bugzyme Chat</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1d2229; --border:#2a303a;
    --text:#e8eaed; --muted:#8b93a1; --accent:#5b8def; --accent2:#7bd88f;
    --danger:#e5636e; --warn:#e0b341;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  header{padding:12px 20px; border-bottom:1px solid var(--border);}
  header h1{font-size:17px; margin:0;}
  header .subtitle{color:var(--muted); font-size:11px; margin:2px 0 0;}

  details.config{border-bottom:1px solid var(--border); background:var(--panel);}
  details.config summary{padding:8px 20px; font-size:11px; color:var(--muted); cursor:pointer;}
  .config-bar{display:flex; gap:10px; flex-wrap:wrap; padding:6px 20px 12px;}
  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  input, select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 8px; border-radius:6px; font-size:12px; min-width:150px;
  }
  input:focus{outline:1px solid var(--accent);}
  button{
    background:var(--accent); color:white; border:none; padding:8px 14px;
    border-radius:6px; font-size:12px; cursor:pointer; font-weight:600;
  }
  button.secondary{background:var(--panel2); border:1px solid var(--border); color:var(--text);}
  button.danger{background:var(--danger);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button:hover:not(:disabled){filter:brightness(1.1);}

  .login-bar{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding:12px 20px; border-bottom:1px solid var(--border);}
  .login-status{font-size:12px; color:var(--muted);}
  .login-status.ok{color:var(--accent2);}
  .login-status.err{color:var(--danger);}

  .app{flex:1; display:flex; overflow:hidden;}

  .sidebar{
    width:300px; min-width:260px; border-right:1px solid var(--border);
    display:flex; flex-direction:column; background:var(--panel);
  }
  .sidebar-head{padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
  .sidebar-head span{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .contact-list{flex:1; overflow-y:auto;}
  .contact-item{
    padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .contact-item:hover{background:var(--panel2);}
  .contact-item.active{background:var(--panel2); border-left:3px solid var(--accent);}
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    flex-shrink:0; position:relative; color:white;
  }
  .avatar .presence{
    position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%;
    background:var(--danger); border:2px solid var(--panel);
  }
  .avatar .presence.online{background:var(--accent2);}
  .contact-info{flex:1; min-width:0;}
  .contact-name{font-size:13px; font-weight:600;}
  .contact-sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conn-dot{width:8px; height:8px; border-radius:50%; background:var(--border); flex-shrink:0;}
  .conn-dot.online{background:var(--accent2); box-shadow:0 0 5px var(--accent2);}
  .conn-dot.connecting{background:var(--warn);}
  .unread-badge{
    background:var(--accent); color:white; font-size:10px; font-weight:700;
    border-radius:10px; padding:2px 6px; min-width:16px; text-align:center;
  }

  .chat-window{flex:1; display:flex; flex-direction:column;}
  .chat-header{
    padding:12px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .chat-header .name{font-size:14px; font-weight:600;}
  .chat-header .meta{font-size:11px; color:var(--muted);}
  .empty-state{flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; text-align:center; padding:20px;}

  .log{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px;}
  .bubble-row{display:flex;}
  .bubble-row.mine{justify-content:flex-end;}
  .bubble{
    max-width:70%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.4;
    background:var(--panel2); border:1px solid var(--border);
  }
  .bubble-row.mine .bubble{background:var(--accent); border-color:var(--accent); color:white;}
  .bubble .meta{font-size:10px; color:var(--muted); margin-top:3px;}
  .bubble-row.mine .bubble .meta{color:rgba(255,255,255,.75);}
  .sys-line{font-size:11px; color:var(--muted); text-align:center; font-family:"SF Mono",Consolas,monospace;}
  .sys-line.err{color:var(--danger);}

  .typing-indicator{font-size:11px; color:var(--muted); padding:0 18px 6px; font-style:italic; min-height:16px;}

  .msg-row{display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border);}
  .msg-row input{flex:1; min-width:0;}

  .refresh-link{font-size:11px; color:var(--accent); cursor:pointer; background:none; border:none; padding:0;}
</style>
</head>
<body>

<header>
  <h1>Bugzyme Chat</h1>
  <p class="subtitle">Log in, pick a contact, and chat live — real chat records, JSON message protocol, delivery + presence events.</p>
</header>

<details class="config">
  <summary>Advanced: API / endpoint settings</summary>
  <div class="config-bar">
    <div class="field"><label>API Base URL</label><input id="apiBase" value="https://bugzyme-1.onrender.com"></div>
    <div class="field"><label>WS Base URL</label><input id="wsBase" value="wss://bugzyme-1.onrender.com"></div>
    <div class="field"><label>Login endpoint path</label><input id="loginPath" value="/login"></div>
    <div class="field"><label>Users list endpoint path</label><input id="usersPath" value="/users"></div>
    <div class="field"><label>Create/get chat endpoint path</label><input id="chatsPath" value="/chats"></div>
    <div class="field"><label>Message history endpoint (use {chatId})</label><input id="messagesPath" value="/messages/{chatId}" style="min-width:190px;"></div>
    <div class="field"><label>WS path template</label><input id="wsPath" value="/ws/{chatId}?token={token}" style="min-width:220px;"></div>
  </div>
</details>

<div class="login-bar">
  <div class="field"><label>Email</label><input id="username" placeholder="e.g. sandeep@test.com"></div>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="password"></div>
  <button id="loginBtn">Log in</button>
  <span class="login-status" id="loginStatus">not logged in</span>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <span>Contacts</span>
      <button class="refresh-link" id="refreshBtn">refresh</button>
    </div>
    <div class="contact-list" id="contactList">
      <div class="empty-state" style="padding:20px;">Log in to load contacts.</div>
    </div>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="empty-state">Pick a contact on the left to start chatting.</div>
  </div>
</div>

<script>
const apiBaseEl = document.getElementById('apiBase');
const wsBaseEl = document.getElementById('wsBase');
const loginPathEl = document.getElementById('loginPath');
const usersPathEl = document.getElementById('usersPath');
const chatsPathEl = document.getElementById('chatsPath');
const messagesPathEl = document.getElementById('messagesPath');
const wsPathEl = document.getElementById('wsPath');

const usernameEl = document.getElementById('username');
const passwordEl = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const loginStatus = document.getElementById('loginStatus');

const contactListEl = document.getElementById('contactList');
const chatWindowEl = document.getElementById('chatWindow');
const refreshBtn = document.getElementById('refreshBtn');

let token = null;
let myUsername = null;
let myUserId = null;
let contacts = []; // raw /users list

// Keyed by contact user id. Each entry resolves to a real chat_id once /chats is called.
const convos = {}; // userId -> { label, chatId, ws, status, items: [], unread, dbOnline, dbLastSeen }
let activeUserId = null;

function decodeJwtPayload(tok){
  try {
    const part = tok.split('.')[1];
    const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(b64));
  } catch(e){ return null; }
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}
function initials(name){
  return (name || '?').trim().slice(0,2).toUpperCase();
}
function formatLastSeen(iso){
  if (!iso) return 'never';
  try { return new Date(iso).toLocaleString(); } catch(e){ return iso; }
}
function authHeaders(extra){
  return Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {});
}

// ---------- LOGIN ----------
loginBtn.onclick = async () => {
  const base = apiBaseEl.value.replace(/\/$/, '');
  const path = loginPathEl.value.startsWith('/') ? loginPathEl.value : '/' + loginPathEl.value;
  const url = base + path;
  loginStatus.textContent = 'logging in...';
  loginStatus.className = 'login-status';
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ username: usernameEl.value, password: passwordEl.value }).toString()
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      loginStatus.textContent = `Login failed (${resp.status}): ${JSON.stringify(data)}`;
      loginStatus.className = 'login-status err';
      return;
    }
    token = data.access_token;
    if (!token) {
      loginStatus.textContent = `No access_token in response: ${JSON.stringify(data)}`;
      loginStatus.className = 'login-status err';
      return;
    }
    myUsername = usernameEl.value;
    const payload = decodeJwtPayload(token);
    myUserId = payload && payload.sub != null ? String(payload.sub) : null;
    loginStatus.textContent = `Logged in as ${myUsername}`;
    loginStatus.className = 'login-status ok';
    passwordEl.value = '';
    await loadContacts();
  } catch (e) {
    loginStatus.textContent = `Login error: ${e.message} (check CORS / base URL)`;
    loginStatus.className = 'login-status err';
  }
};

refreshBtn.onclick = () => { if (token) loadContacts(); };

// ---------- CONTACTS ----------
async function loadContacts(){
  const base = apiBaseEl.value.replace(/\/$/, '');
  const path = usersPathEl.value.startsWith('/') ? usersPathEl.value : '/' + usersPathEl.value;
  const url = base + path;
  contactListEl.innerHTML = `<div class="empty-state" style="padding:20px;">Loading contacts...</div>`;
  try {
    const resp = await fetch(url, { headers: authHeaders() });
    const data = await resp.json().catch(() => []);
    if (!resp.ok) {
      contactListEl.innerHTML = `<div class="empty-state" style="padding:20px; color:var(--danger);">Failed to load contacts (${resp.status})</div>`;
      return;
    }
    contacts = Array.isArray(data)
      ? data.filter(u => myUserId != null ? String(u.id) !== myUserId : u.username !== myUsername)
      : [];
    renderContactList();
  } catch (e) {
    contactListEl.innerHTML = `<div class="empty-state" style="padding:20px; color:var(--danger);">${escapeHtml(e.message)}</div>`;
  }
}

// ---------- OPEN A CONVERSATION ----------
async function openChat(user){
  const userId = user.id;
  if (!convos[userId]) {
    convos[userId] = {
      label: user.username, chatId: null, ws: null, status: 'resolving',
      items: [], unread: 0, dbOnline: user.is_online, dbLastSeen: user.last_seen,
      pendingSentItems: [], pendingReadIds: []
    };
    activeUserId = userId;
    renderChatWindow();
    renderContactList();
    await resolveChat(userId, user.id);
  } else {
    activeUserId = userId;
    convos[userId].unread = 0;
    flushReadReceipts(userId);
    renderChatWindow();
    renderContactList();
  }
}

function flushReadReceipts(userId){
  const convo = convos[userId];
  if (!convo || !convo.ws || convo.ws.readyState !== WebSocket.OPEN) return;
  convo.pendingReadIds.forEach(id => {
    convo.ws.send(JSON.stringify({ type: 'read', message_id: id }));
  });
  convo.pendingReadIds = [];
}

async function resolveChat(userId, otherUserId){
  const convo = convos[userId];
  const base = apiBaseEl.value.replace(/\/$/, '');
  const path = chatsPathEl.value.startsWith('/') ? chatsPathEl.value : '/' + chatsPathEl.value;
  const url = base + path;
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ user2_id: otherUserId })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      convo.status = 'offline';
      pushSys(userId, `Could not create/get chat (${resp.status}): ${JSON.stringify(data)}`, 'err');
      if (activeUserId === userId) renderChatWindow();
      return;
    }
    convo.chatId = data.id;
    pushSys(userId, `Chat resolved: chat_id=${data.id}`, 'sys');
    await loadHistory(userId, data.id);
    connectChat(userId);
  } catch (e) {
    convo.status = 'offline';
    pushSys(userId, `Error resolving chat: ${e.message}`, 'err');
    if (activeUserId === userId) renderChatWindow();
  }
}

async function loadHistory(userId, chatId){
  const base = apiBaseEl.value.replace(/\/$/, '');
  const path = (messagesPathEl.value.startsWith('/') ? messagesPathEl.value : '/' + messagesPathEl.value)
    .replace('{chatId}', chatId);
  const url = base + path;
  try {
    const resp = await fetch(url, { headers: authHeaders() });
    const data = await resp.json().catch(() => []);
    if (resp.ok && Array.isArray(data)) {
      const convo = convos[userId];
      data.forEach(m => {
        convo.items.push({
          kind: 'msg',
          mine: String(m.sender_id) === myUserId,
          text: m.content,
          time: m.created_at ? new Date(m.created_at).toLocaleTimeString() : ''
        });
      });
      if (activeUserId === userId) renderChatWindow();
    }
  } catch (e) {
    pushSys(userId, `Could not load history: ${e.message}`, 'err');
  }
}

// ---------- WEBSOCKET ----------
function connectChat(userId){
  const convo = convos[userId];
  if (!convo.chatId) return;
  const wsBase = wsBaseEl.value.replace(/\/$/, '');
  let path = wsPathEl.value
    .replace('{chatId}', encodeURIComponent(convo.chatId))
    .replace('{token}', encodeURIComponent(token));
  if (!path.startsWith('/')) path = '/' + path;
  const url = wsBase + path;

  convo.status = 'connecting';
  renderContactList();
  if (activeUserId === userId) renderChatWindow();

  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    convo.status = 'offline';
    pushSys(userId, `WebSocket error: ${e.message}`, 'err');
    renderContactList();
    if (activeUserId === userId) renderChatWindow();
    return;
  }
  convo.ws = ws;

  ws.onopen = () => {
    convo.status = 'online';
    pushSys(userId, 'Connected.', 'sys');
    renderContactList();
    if (activeUserId === userId) renderChatWindow();
  };

  ws.onmessage = (evt) => {
    let data;
    try { data = JSON.parse(evt.data); } catch(e) { data = null; }

    if (!data) {
      pushSys(userId, `recv (non-JSON): ${evt.data}`, 'sys');
    } else if (data.type === 'message') {
      convo.items.push({
        kind: 'msg', mine: false, text: data.content, messageId: data.message_id,
        time: data.created_at ? new Date(data.created_at).toLocaleTimeString() : new Date().toLocaleTimeString()
      });
      convo.lastPreview = data.content;
      if (activeUserId !== userId) {
        convo.unread = (convo.unread || 0) + 1;
        if (data.message_id != null) convo.pendingReadIds.push(data.message_id);
      } else if (data.message_id != null && convo.ws && convo.ws.readyState === WebSocket.OPEN) {
        convo.ws.send(JSON.stringify({ type: 'read', message_id: data.message_id }));
      }
    } else if (data.type === 'message_delivered') {
      const item = convo.pendingSentItems.shift();
      if (item) { item.messageId = data.message_id; item.status = 'delivered'; }
    } else if (data.type === 'message_read') {
      const item = convo.items.find(m => m.mine && m.messageId === data.message_id);
      if (item) item.status = 'read';
    } else if (data.type === 'presence') {
      convo.dbOnline = data.status === 'online';
      pushSys(userId, `${convo.label} is now ${data.status}`, 'sys');
    } else if (data.type === 'typing') {
      pushSys(userId, `${convo.label} is typing...`, 'sys');
    } else {
      pushSys(userId, `recv: ${evt.data}`, 'sys');
    }
    renderContactList();
    if (activeUserId === userId) renderChatWindow();
  };

  ws.onerror = () => { pushSys(userId, 'WebSocket error (see browser console).', 'err'); };

  ws.onclose = (evt) => {
    convo.status = 'offline';
    pushSys(userId, `Closed (code ${evt.code}${evt.reason ? ', ' + evt.reason : ''}).`, 'sys');
    renderContactList();
    if (activeUserId === userId) renderChatWindow();
  };
}

function pushSys(userId, text, cls){
  const convo = convos[userId];
  if (!convo) return;
  convo.items.push({ kind: 'sys', text, cls, time: new Date().toLocaleTimeString() });
}

// ---------- RENDER ----------
function renderContactList(){
  contactListEl.innerHTML = '';
  if (!contacts.length) {
    contactListEl.innerHTML = `<div class="empty-state" style="padding:20px;">${token ? 'No contacts found.' : 'Log in to load contacts.'}</div>`;
    return;
  }
  contacts.forEach(user => {
    const convo = convos[user.id];
    const item = document.createElement('div');
    item.className = 'contact-item' + (user.id === activeUserId ? ' active' : '');
    const sub = convo && convo.lastPreview
      ? convo.lastPreview
      : (user.is_online ? 'online' : 'last seen ' + formatLastSeen(user.last_seen));
    item.innerHTML = `
      <div class="avatar">${initials(user.username)}<span class="presence ${user.is_online ? 'online' : ''}"></span></div>
      <div class="contact-info">
        <div class="contact-name">${escapeHtml(user.username)}</div>
        <div class="contact-sub">${escapeHtml(sub)}</div>
      </div>
      ${convo ? `<span class="conn-dot ${convo.status === 'online' ? 'online' : convo.status === 'connecting' || convo.status === 'resolving' ? 'connecting' : ''}"></span>` : ''}
      ${convo && convo.unread ? `<span class="unread-badge">${convo.unread}</span>` : ''}
    `;
    item.onclick = () => openChat(user);
    contactListEl.appendChild(item);
  });
}

function renderChatWindow(){
  if (!activeUserId || !convos[activeUserId]) {
    chatWindowEl.innerHTML = `<div class="empty-state">Pick a contact on the left to start chatting.</div>`;
    return;
  }
  const convo = convos[activeUserId];
  chatWindowEl.innerHTML = `
    <div class="chat-header">
      <div>
        <div class="name">${escapeHtml(convo.label)}</div>
        <div class="meta">WS: ${convo.status} · DB: ${convo.dbOnline ? 'online' : 'last seen ' + formatLastSeen(convo.dbLastSeen)}</div>
      </div>
      <div>
        ${convo.status === 'online'
          ? `<button class="danger" id="disconnectBtn">Disconnect</button>`
          : `<button class="secondary" id="reconnectBtn" ${!convo.chatId ? 'disabled' : ''}>Reconnect</button>`}
      </div>
    </div>
    <div class="log" id="activeLog"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="msg-row">
      <input id="msgInput" placeholder="Type a message and press Enter" ${convo.status !== 'online' ? '' : ''}>
      <button id="sendBtn">Send</button>
    </div>
  `;
  const logEl = document.getElementById('activeLog');
  convo.items.forEach(m => {
    if (m.kind === 'sys') {
      const div = document.createElement('div');
      div.className = 'sys-line' + (m.cls === 'err' ? ' err' : '');
      div.textContent = `${m.time} — ${m.text}`;
      logEl.appendChild(div);
    } else {
      const row = document.createElement('div');
      row.className = 'bubble-row' + (m.mine ? ' mine' : '');
      let tick = '';
      if (m.mine) {
        if (m.status === 'read') tick = ' · seen ✓✓';
        else if (m.status === 'delivered') tick = ' · delivered ✓✓';
        else tick = ' · sent ✓';
      }
      row.innerHTML = `<div class="bubble">${escapeHtml(m.text)}<div class="meta">${m.time}${tick}</div></div>`;
      logEl.appendChild(row);
    }
  });
  logEl.scrollTop = logEl.scrollHeight;

  const disconnectBtn = document.getElementById('disconnectBtn');
  if (disconnectBtn) disconnectBtn.onclick = () => { if (convo.ws) convo.ws.close(); };
  const reconnectBtn = document.getElementById('reconnectBtn');
  if (reconnectBtn) reconnectBtn.onclick = () => connectChat(activeUserId);

  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  function send(){
    const text = msgInput.value.trim();
    if (!text) return;
    if (!convo.ws || convo.ws.readyState !== WebSocket.OPEN) {
      pushSys(activeUserId, 'Not connected — cannot send.', 'err');
      renderChatWindow();
      return;
    }
    convo.ws.send(JSON.stringify({ type: 'message', content: text }));
    const item = { kind: 'msg', mine: true, text, time: new Date().toLocaleTimeString(), status: 'sent', messageId: null };
    convo.items.push(item);
    convo.pendingSentItems.push(item);
    convo.lastPreview = text;
    msgInput.value = '';
    renderChatWindow();
    renderContactList();
  }
  sendBtn.onclick = send;
  msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  msgInput.focus();
}
</script>

</body>
</html>
